name: braincog14
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python >=3.9
  - pytorch >=2.1
  - pytorch-cuda =12.8
  - numpy >=1.24
  - scipy >=1.10
  - matplotlib >=3.7
  - pandas >=2.0
  - scikit-learn >=1.3
  - tqdm
  - pip
  - pip:
      - transformers >=4.36
      - nibabel >=5.0
      - nilearn >=0.10
      - nimare >=0.2
      - requests
      - statsmodels >=0.14
      - networkx >=3.0
      - datasets >=2.14
      - openai >=1.0
